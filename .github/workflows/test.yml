name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Porch revision the acceptance tests run against.
  PORCH_REPOSITORY: aurimasniekis/go-porch
  PORCH_COMMIT: c92d006627c207ddf57ba5845f89dd1978b35c7a
  TERRAFORM_VERSION: 1.11.4

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: go test ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: make docs-check

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PORCH_REPOSITORY }}
          ref: ${{ env.PORCH_COMMIT }}
          path: porch-checkout
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Build Porch
        run: make porch-src porch-bin PORCH_REPO=porch-checkout PORCH_COMMIT=${{ env.PORCH_COMMIT }}
      - name: Acceptance tests
        run: make testacc
      - name: Families scenario
        run: make families
