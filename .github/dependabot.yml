# Dependency update PRs. Minor and patch updates are grouped per ecosystem; a new version is proposed only after it
# has been out for a week. Actions stay pinned by commit SHA (Dependabot updates the SHA and its version comment).
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
